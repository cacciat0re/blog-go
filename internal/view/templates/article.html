<!DOCTYPE html>
<html lang="{{.Lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}}</title>
  <meta name="description" content="{{.Summary}}">
</head>
<body>
  <main>
    <article>
      <h1>{{.Title}}</h1>
      <p>{{.Summary}}</p>
      <time datetime="{{.UpdatedAt.Format "2006-01-02T15:04:05Z07:00"}}">{{.UpdatedAt.Format "2006-01-02"}}</time>
      <div class="content">
        {{.Content}}
      </div>
    </article>
  </main>
</body>
</html>
