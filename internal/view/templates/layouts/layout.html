{{- /*
  The document shell. Every page supplies a "content" block; the partials
  supply the header and footer.
*/ -}}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Meta.Title}}</title>
  <meta name="description" content="{{.Meta.Description}}">
  {{- if .Meta.SiteName }}
  <meta property="og:site_name" content="{{.Meta.SiteName}}">
  {{- end }}
  <meta property="og:title" content="{{.Meta.Title}}">
  <meta property="og:description" content="{{.Meta.Description}}">
  {{- if .Meta.Path }}
  <meta property="og:url" content="{{.Meta.Path}}">
  {{- end }}
  <link rel="icon" type="image/svg+xml" href="/assets/img/logo.svg">
  <link rel="stylesheet" href="/assets/index.css">
  <link rel="stylesheet" href="/assets/katex/katex.min.css">
</head>
<body>
  <a class="absolute left-[-9999px] top-0 z-50 bg-ink px-4 py-3 text-meta text-paper focus:left-6 focus:top-6 print:hidden" href="#content">跳到正文</a>
  {{ template "header" .Data }}
  <main id="content">
    {{ template "content" .Data }}
  </main>
  {{ template "footer" .Data }}
</body>
</html>
